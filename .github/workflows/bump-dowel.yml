# 検証に用いる dowel の版を進める pull request を起票する。
#
# 本家が直っても、誰かが気づいて `dowel-ref` を書き換えるまで `xfail` は
# 落ちたままである。気づく仕事を機械に移す。
#
# 起票するだけで、取り込みはしない。版を進めてよいかどうかは、その pull
# request に対する検査が決める。とくに `xfail` が `xpass` へ変われば
# 「本家が直ったので `known_issue` を外す番」という意味になり、それは
# 人が判断して書き換える作業である。
#
# 枝はひとつ（`chore/bump-dowel`）に固定し、先端が動くたびに上書きする。
# 版ごとに枝を作ると、取り込まないまま枝と pull request が溜まる。
#
# 外部アクションはコミットへ固定する。

name: bump-dowel

on:
  schedule:
    # verify の日次実行（03:00）の後。先端に対する参考の結果が出てから起票する。
    - cron: "30 3 * * *"
  workflow_dispatch:
    inputs:
      dowel_ref:
        description: 進める先の版（省略すると本家の main の先端）
        type: string
        default: ""

concurrency:
  group: bump-dowel
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

env:
  BUMP_BRANCH: chore/bump-dowel

jobs:
  bump:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Bump the pinned revision
        id: bump
        env:
          REQUESTED: ${{ inputs.dowel_ref }}
        run: |
          before=$(grep -v '^[[:space:]]*#' dowel-ref | grep -v '^[[:space:]]*$' | tail -1 | tr -d '[:space:]')
          ./scripts/bump-dowel.sh ${REQUESTED:+"$REQUESTED"}
          if git diff --quiet; then
            echo "既に最新である（$before）。"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            after=$(grep -v '^[[:space:]]*#' dowel-ref | grep -v '^[[:space:]]*$' | tail -1 | tr -d '[:space:]')
            echo "changed=true"    >> "$GITHUB_OUTPUT"
            echo "before=$before"  >> "$GITHUB_OUTPUT"
            echo "after=$after"    >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch
        if: steps.bump.outputs.changed == 'true'
        env:
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BUMP_BRANCH"
          git commit -aqm "$(printf 'chore: dowel を %s へ進める\n\n%s から %s へ。文書が引用している版も併せて置き換えた。\n\n取り込む前に検査の結果を見ること。xfail が xpass へ変わっていれば、\n本家がその所見を直したということであり、docs/10-findings.md を更新して\nknown_issue の宣言を外す作業が要る。' \
            "${AFTER:0:12}" "${BEFORE:0:12}" "${AFTER:0:12}")"
          # 先端が動くたびに上書きする。取り込まないまま枝が溜まらないようにする。
          git push --force-with-lease origin "$BUMP_BRANCH"

      - name: Open the pull request
        if: steps.bump.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BEFORE: ${{ steps.bump.outputs.before }}
          AFTER: ${{ steps.bump.outputs.after }}
        run: |
          api="https://api.github.com/repos/$GITHUB_REPOSITORY"
          auth=(-H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json")

          open=$(curl -sS "${auth[@]}" \
            "$api/pulls?state=open&head=${GITHUB_REPOSITORY%%/*}:$BUMP_BRANCH" | jq -r '.[0].number // ""')

          if [ -n "$open" ]; then
            echo "既に開いている pull request がある: #$open（枝を上書きしたので中身は最新）"
            exit 0
          fi

          body=$(cat <<EOF
          \`dowel-ref\` を \`${BEFORE:0:12}\` から \`${AFTER:0:12}\` へ進める。
          文書が引用している版も併せて置き換えてある（\`docs\` の段が両者の一致を検査する）。

          - 進めた先: [\`${AFTER:0:12}\`](https://github.com/sabas0ba/dowel/commit/$AFTER)
          - 差分: [\`${BEFORE:0:12}...${AFTER:0:12}\`](https://github.com/sabas0ba/dowel/compare/$BEFORE...$AFTER)

          ## 取り込む前に見ること

          この pull request の \`verify\` が、進めた先の dowel に対する結果である。

          | 出たもの | 意味 | すること |
          |---|---|---|
          | \`xpass\` | 本家がその所見を直した | \`docs/10-findings.md\` を更新し、\`known_issue\` の宣言を外す |
          | \`failed\` | 本家の変更がこちらの期待と食い違う | 実装・文書・本スイートのどれが誤りかを判断する |
          | 変化なし | 検査に影響しない変更だった | そのまま取り込んでよい |

          この枝は先端が動くたびに上書きされる。取り込まないでいると、
          内容は自動的により新しい版へ進む。

          ---
          _Generated by [Claude Code](https://claude.ai/code)_
          EOF
          )

          curl -sS -X POST "${auth[@]}" "$api/pulls" \
            -d "$(jq -n --arg t "chore: dowel を ${AFTER:0:12} へ進める" \
                        --arg h "$BUMP_BRANCH" --arg b "main" \
                        --arg body "$(printf '%s' "$body" | sed 's/^          //')" \
                  '{title: $t, head: $h, base: $b, body: $body}')" \
            | jq -r '"opened: " + (.html_url // (.message + " " + ((.errors // []) | tostring)))'
