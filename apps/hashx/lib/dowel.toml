[package]
name    = "hashx"
version = "0.4.0"
edition = "2026"
# 配ったときに pkg-config の記述子へ入る（ADR-0043）。無ければパッケージ名が
# 代わりに立つが、それは「名前を2度書いた」記述子であり、引いた相手に何も
# 伝えない。配るライブラリなら書く側の仕事である。
description = "small, dependency-free hashes with a C ABI (FNV-1a and CRC-32)"

[features]
default = []
# 表を実行時に組み立てる版。記憶の小さい対象向け。
small   = []
# 共有ライブラリとして配る版（ADR-0030）。dowel を使わない相手へ渡す形は
# これが最初の1つである。静的な書庫は「その木の中でしか意味がない」形で
# あり、配布の相手は書庫を読めても再リンクを要求される。
shared  = []
