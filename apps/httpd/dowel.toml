[package]
name    = "httpd"
version = "0.3.0"
edition = "2026"

[features]
default = ["poll"]
# 待ち方の実装を選ぶ。epoll は Linux 固有、poll はどこでも動く。
# 実アプリでは「同じ見出しの裏で実装を差し替える」形が普通に要る。
epoll   = []
poll    = []
# 接続ごとにスレッドを起こす。pthread が要る。
threads = []
# 検査用。実行時の誤りを黙らせずに落とす。配る版には入れない。
sanitize = []
# 待ち方は択一である。両方立った木は、書庫の中で片方が黙って勝つ。
exclusive = [["epoll", "poll"]]
