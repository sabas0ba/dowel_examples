[package]
name    = "dsp-fw"
version = "0.1.0"
edition = "2026"
# 三つ組ごとの道具立ては、この木で1つの表を共有する（ADR-0033）。
toolchains = "../toolchains.toml"
# この木はベアメタル専用である。宣言しておくと、--target を付け忘れた
# ときに旗についての苦情ではなく `unsupported-target` が返る。
targets = ["thumbv7em-none-eabihf"]

[[dependencies]]
name = "dsp-core"
path = "../core"
