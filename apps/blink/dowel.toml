[package]
name    = "blink"
version = "0.1.0"
edition = "2026"
# この木はホスト向けではない。宣言しておくと、--target を付け忘れたときに
# フラグについての苦情ではなく `unsupported-target` が返る。
targets = ["thumbv7em-none-eabihf"]

# ベアメタルの対象。OS を持たない triple であり、libc も起動コードも無い。
#
# 対象を増やすときは、この表を1つ足し、`ld/<triple>.ld` を置き、
# `dowel.build` の flags を `match cfg.target` にする（README を見よ）。
[toolchain.thumbv7em-none-eabihf]
c       = "arm-none-eabi-gcc"
ar      = "arm-none-eabi-ar"
objcopy = "arm-none-eabi-objcopy"
# 繋ぐ側。arm-none-eabi-gdb は Ubuntu のパッケージに無いため、
# 多アーキテクチャ版の gdb を名指しする。
debug   = "gdb-multiarch"
